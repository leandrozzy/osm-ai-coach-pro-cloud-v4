<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>OSM AI Coach Pro</title>
</head>
<body><div id="app"></div>
<script>
(function(){
 const p=new URLSearchParams(location.search);if(p.get('exportGameCoach')!=='1')return;
 const app=document.getElementById('app');
 app.innerHTML='<main style="font-family:system-ui;padding:24px;background:#101b24;color:white;min-height:100vh"><h2>Conectando Game AI Coach…</h2><p id="m">Lendo as APIs salvas neste OSM.</p></main>';
 try{
  const keys=JSON.parse(localStorage.getItem('osm-ai-coach-pro:api-keys:v1')||'{}');
  if(!keys.google&&!keys.groq){document.getElementById('m').textContent='Nenhuma chave Gemini/Groq está salva neste navegador do OSM.';return;}
  location.href='gameaicoach://import?data='+encodeURIComponent(JSON.stringify({google:String(keys.google||''),groq:String(keys.groq||'')}));
 }catch(e){document.getElementById('m').textContent='Não foi possível ler as APIs salvas.';}
})();
</script>
<script type="module" src="/app.js"></script></body></html>
