name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'android-collector/**'
      - 'apply_native_current.py'
      - 'SlotNavigationTracker.V26.kt'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V26 hub-aware routing
        run: python apply_native_current.py
      - name: Validate generated source
        run: |
          grep -q 'V26.0' android-collector/app/src/main/java/com/osmaicoach/collector/MainActivity.kt
          grep -q 'readHubCards' android-collector/app/src/main/java/com/osmaicoach/collector/LocalOcrExtractor.kt
          grep -q 'hub_cards_detected' android-collector/app/src/main/java/com/osmaicoach/collector/NativeSessionProcessor.kt
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/osm-release.p12"
      - name: Build signed APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/osm-release.p12
        working-directory: android-collector
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-v26-${{ github.run_number }}
          path: android-collector/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
