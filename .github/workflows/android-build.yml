name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'android-collector/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          TRACKER="android-collector/app/src/main/java/com/osmaicoach/collector/SlotNavigationTracker.kt"
          OCR="android-collector/app/src/main/java/com/osmaicoach/collector/LocalOcrExtractor.kt"

          test -s "$TRACKER"
          test -s "$OCR"

          grep -Fq "object SlotNavigationTracker" "$TRACKER"
          grep -Fq "class LocalOcrExtractor" "$OCR"

          echo "Native source files OK"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/osm-release.p12"
          test -s "$RUNNER_TEMP/osm-release.p12"

      - name: Build signed APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/osm-release.p12
        working-directory: android-collector
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-final-${{ github.run_number }}
          path: android-collector/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
