name: Apply OSM Web Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'apply_web_hotfix.py'
      - '.github/workflows/osm-web-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hotfix
        run: python apply_web_hotfix.py

      - name: Validate web build
        run: |
          npm install
          npm run build

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui.js
          git diff --cached --quiet || git commit -m "Fix automatic OSM session processing"
          git push
          
