name: Fix and Build Native Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'fix_native_pro_build.py'
      - '.github/workflows/android-native-pro-fix.yml'

permissions:
  contents: write

jobs:
  native-pro-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply build fix
        run: python fix_native_pro_build.py

      - name: Save fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-collector
          git diff --cached --quiet || git commit -m "Fix Native Pro Kotlin build"
          git push

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/osm-release.p12"

      - name: Build signed APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/osm-release.p12
        working-directory: android-collector
        run: gradle :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-native-pro-fixed
          path: android-collector/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
