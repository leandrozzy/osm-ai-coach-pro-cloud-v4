name: Build Fully Integrated Android

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'full_integration_patch.py'
      - 'android-collector/**'
      - 'src/**'
      - '.github/workflows/android-full-integration.yml'

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full integration patch
        run: python full_integration_patch.py

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src android-collector
          git diff --cached --quiet || git commit -m "Fully integrate Android collector with Coach"
          git push

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify web app
        run: |
          npm install
          npm run build

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/osm-release.p12"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/osm-release.p12
        working-directory: android-collector
        run: gradle :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-pro-signed-release
          path: android-collector/app/build/outputs/apk/release/app-release.apk
          
