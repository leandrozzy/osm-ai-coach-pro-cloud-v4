name: Apply OSM Progress Fix

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'apply_progress_fix.py'
      - '.github/workflows/osm-progress-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply progress and slot fix
        run: python apply_progress_fix.py

      - name: Validate web build
        run: |
          npm install
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui.js
          git diff --cached --quiet || git commit -m "Add real OSM progress and improve slot processing"
          git push
