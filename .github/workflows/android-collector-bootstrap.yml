name: Build Android Collector

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'android-collector/**'
      - '.github/workflows/android-collector-bootstrap.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: android-collector
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-collector-debug
          path: android-collector/app/build/outputs/apk/debug/app-debug.apk
