name: Bootstrap Android Collector

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair Android Collector
        run: unzip -o android-collector-overlay.zip -d .

      - name: Salvar arquivos extraidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-collector .github/workflows/android-debug-apk.yml
          git diff --cached --quiet || git commit -m "Add Android OSM Collector v1"
          git push

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: android-collector
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-collector-debug
          path: android-collector/app/build/outputs/apk/debug/app-debug.apk
