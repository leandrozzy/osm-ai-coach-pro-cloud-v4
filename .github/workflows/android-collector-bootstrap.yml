name: Apply Android Integrated v2

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1
    paths:
      - 'android-integrated-v2.zip'
      - '.github/workflows/android-collector-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar atualização v2
        run: unzip -o android-integrated-v2.zip -d .

      - name: Salvar atualização v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-collector
          git diff --cached --quiet || git commit -m "Integrate Android collector with Coach preview"
          git push

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: android-collector
        run: gradle :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-collector-integrated-v2
          path: android-collector/app/build/outputs/apk/debug/app-debug.apk
