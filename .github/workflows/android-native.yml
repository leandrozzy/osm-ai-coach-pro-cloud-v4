name: OSM Coach Native (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'osm-coach/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

concurrency:
  group: osm-coach-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: osm-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura (opcional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/osm-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/osm-release.p12" >> "$GITHUB_ENV"
            echo "Keystore restaurado."
          else
            echo "Sem keystore nos secrets: o release será assinado com a chave de debug."
          fi

      - name: Clean
        run: gradle --no-daemon clean

      - name: Testes unitários
        id: tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Erros do lint no resumo da execução
        if: always() && steps.lint.outcome == 'failure'
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          f = "app/build/reports/lint-results-debug.xml"
          print("## Erros do lint")
          if not os.path.exists(f):
              print("Relatório XML não encontrado.")
          else:
              n = 0
              for i in ET.parse(f).getroot().iter("issue"):
                  if i.get("severity") in ("Error", "Fatal"):
                      loc = i.find("location")
                      where = (loc.get("file") + ":" + str(loc.get("line"))) if loc is not None else ""
                      print("- **" + str(i.get("id")) + "**: " + str(i.get("message")) + " — " + where)
                      n += 1
              print("Total de erros: " + str(n))
          PY

      - name: APK debug
        id: debug
        run: gradle --no-daemon :app:assembleDebug

      - name: APK release
        id: release
        continue-on-error: true
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Publicar APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-coach-apk-${{ github.run_number }}
          path: |
            osm-coach/app/build/outputs/apk/debug/*.apk
            osm-coach/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-coach-reports-${{ github.run_number }}
          path: |
            osm-coach/app/build/reports/tests/
            osm-coach/app/build/reports/lint-results-debug.html
            osm-coach/app/build/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo e falha se testes/lint falharam
        if: always()
        run: |
          echo "tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }} debug=${{ steps.debug.outcome }} release=${{ steps.release.outcome }}"
          if [ "${{ steps.tests.outcome }}" = "failure" ] || [ "${{ steps.lint.outcome }}" = "failure" ] || [ "${{ steps.debug.outcome }}" = "failure" ]; then
            exit 1
          fi
