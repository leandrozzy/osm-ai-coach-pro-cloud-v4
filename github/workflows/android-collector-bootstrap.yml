name: Bootstrap Android Collector

on:
  workflow_dispatch:
  push:
    branches:
      - android-collector-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: android-collector-v1

      - name: Recreate Android Collector files
        shell: bash
        run: |
          cat > /tmp/android-collector-overlay.b64 <<'EOF'

EOF
          base64 -d /tmp/android-collector-overlay.b64 > /tmp/android-collector-overlay.zip
          unzip -o /tmp/android-collector-overlay.zip -d .

      - name: Commit collector files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-collector .github/workflows/android-debug-apk.yml
          if git diff --cached --quiet; then
            echo "No collector changes to commit."
          else
            git commit -m "Add Android OSM collector v1"
            git push origin android-collector-v1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-collector
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osm-ai-coach-collector-debug
          path: android-collector/app/build/outputs/apk/debug/app-debug.apk
